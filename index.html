<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aorta Flow Lab</title>
<meta name="description" content="A ParaView-style lesson for exploring blood-flow simulations of a healthy aorta and an aorta with coarctation, right in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 28V14c0-6 4-10 9-10s8 4 8 9v15' fill='none' stroke='%23b02a3e' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="app">

  <header id="toolbar" aria-label="Toolbar">
    <div class="tgroup" aria-label="File">
      <button class="tb" id="btn-open" title="Open data files">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l2 2h8.8A1.5 1.5 0 0 1 21 8.5V18a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z" fill="#e8b43c" stroke="#a87914" stroke-width="1.2"/><path d="M3 10h18" stroke="#a87914" stroke-width="1.2"/></svg>
        <span>Open</span></button>
      <button class="tb" id="btn-shot" title="Save a picture of the view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 7l1.5-2.5h4L15.5 7" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Screenshot</span></button>
    </div>

    <div class="tgroup" aria-label="Coloring">
      <label class="tsel" title="Choose which data colors the selected item">
        <span class="sr">Coloring</span>
        <select id="sel-color" disabled><option>Solid Color</option></select>
      </label>
      <label class="tsel narrow" title="For vectors: show the size (Magnitude) or one direction">
        <span class="sr">Component</span>
        <select id="sel-comp" disabled><option>Magnitude</option></select>
      </label>
      <label class="tsel" title="How the selected item is drawn">
        <span class="sr">Representation</span>
        <select id="sel-repr" disabled>
          <option>Surface</option><option>Surface With Edges</option><option>Wireframe</option><option>Points</option><option>Outline</option>
        </select>
      </label>
    </div>

    <div class="tgroup" aria-label="Camera">
      <button class="tb icon" id="btn-reset" title="Reset camera: fit the model in the view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="#3f7fd9"/></svg>
        <span class="sr">Reset camera</span></button>
      <button class="tb ax" data-view="+X" title="Look along +X">+X</button>
      <button class="tb ax" data-view="-X" title="Look along −X">−X</button>
      <button class="tb ax" data-view="+Y" title="Look along +Y">+Y</button>
      <button class="tb ax" data-view="-Y" title="Look along −Y">−Y</button>
      <button class="tb ax" data-view="+Z" title="Look along +Z">+Z</button>
      <button class="tb ax" data-view="-Z" title="Look along −Z">−Z</button>
      <button class="tb icon" id="btn-rotl" title="Rotate 90° counterclockwise">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8a7 7 0 1 1-1.5 6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 4.5L7 8.5l4-3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="sr">Rotate 90° counterclockwise</span></button>
      <button class="tb icon" id="btn-rotr" title="Rotate 90° clockwise">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 8a7 7 0 1 0 1.5 6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20.5 4.5L17 8.5l-4-3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="sr">Rotate 90° clockwise</span></button>
    </div>

    <div class="tgroup filters" aria-label="Filters">
      <button class="tb filter" id="btn-calc" title="Calculator: make a new array from a formula" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" fill="#f2f4f7" stroke="#59606d" stroke-width="1.3"/><rect x="7.5" y="5.5" width="9" height="3.5" fill="#9fd4a8" stroke="#3a8a4b" stroke-width=".8"/><g fill="#59606d"><circle cx="8.8" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="15.2" cy="12" r="1"/><circle cx="8.8" cy="15" r="1"/><circle cx="12" cy="15" r="1"/><circle cx="15.2" cy="15" r="1"/><circle cx="8.8" cy="18" r="1"/><circle cx="12" cy="18" r="1"/><circle cx="15.2" cy="18" r="1"/></g></svg>
        <span>Calculator</span></button>
      <button class="tb filter" id="btn-clip" title="Clip: cut the model with a plane to see inside" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8-4 8 4v8l-8 4-8-4z" fill="#6fc07d" stroke="#2f7d3e" stroke-width="1.2"/><path d="M12 12L4 8M12 12l8-4M12 12v8" stroke="#2f7d3e" stroke-width="1"/><path d="M3 17L21 6" stroke="#b02a3e" stroke-width="1.8"/></svg>
        <span>Clip</span></button>
      <button class="tb filter" id="btn-stream" title="Stream Tracer: draw the paths the blood follows" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7c4-3 7 3 11 0s5-2 7-1M3 12c4-3 7 3 11 0s5-2 7-1M3 17c4-3 7 3 11 0s5-2 7-1" fill="none" stroke="#3f7fd9" stroke-width="1.7" stroke-linecap="round"/><circle cx="3.5" cy="12" r="2" fill="#6fc07d" stroke="#2f7d3e"/></svg>
        <span>Stream Tracer</span></button>
    </div>

    <div class="tgroup" aria-label="View options">
      <div class="seg" role="radiogroup" aria-label="Layout">
        <button role="radio" data-layout="split" aria-checked="true" title="Show both models side by side">Both</button>
        <button role="radio" data-layout="healthy" aria-checked="false" title="Show only the healthy model">Healthy</button>
        <button role="radio" data-layout="diseased" aria-checked="false" title="Show only the diseased model">Diseased</button>
      </div>
      <label class="tcheck" title="Move both views together"><input type="checkbox" id="chk-link" checked> Link cameras</label>
      <button class="tb toggle" id="btn-probe" aria-pressed="false" title="Show the values under your mouse">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Hover probe</span></button>
      <label class="tcheck" title="Apply changes automatically"><input type="checkbox" id="chk-auto"> Auto Apply</label>
    </div>
    <button class="tb" id="btn-lesson" aria-expanded="true" aria-controls="lesson" title="Show or hide the worksheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 11h7M9 14.5h7M9 18h4" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Worksheet</span></button>
  </header>

  <aside id="left">
    <section id="pipeline" aria-label="Pipeline Browser">
      <h2 class="pane-title">Pipeline Browser</h2>
      <ul id="tree" role="tree"></ul>
    </section>
    <section id="props" aria-label="Properties">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-props" aria-selected="true" aria-controls="props-body">Properties</button>
        <button role="tab" id="tab-info" aria-selected="false" aria-controls="info-body">Information</button>
      </div>
      <div class="apply-row">
        <button id="btn-apply" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Apply</button>
        <button id="btn-resetprops" disabled>Reset</button>
        <button id="btn-delete" disabled>Delete</button>
      </div>
      <div id="props-body" role="tabpanel" aria-labelledby="tab-props"></div>
      <div id="info-body" role="tabpanel" aria-labelledby="tab-info" hidden></div>
    </section>
  </aside>

  <main id="views" data-layout="split">
    <div class="view" id="view-healthy" data-model="healthy">
      <div class="view-label">healthy.vtu</div>
      <div class="legend"></div>
      <div class="empty">Click <b>Open</b> to load the data files.</div>
    </div>
    <div class="view" id="view-diseased" data-model="diseased">
      <div class="view-label">diseased.vtu</div>
      <div class="legend"></div>
      <div class="empty">Click <b>Open</b> to load the data files.</div>
    </div>
    <div id="tooltip" role="status" aria-live="off"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <aside id="lesson" aria-label="Worksheet"></aside>
</div>

<dialog id="open-dialog" aria-labelledby="open-title">
  <form method="dialog">
    <h2 id="open-title">Open File</h2>
    <div class="dlg-path"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l2 2h8.8A1.5 1.5 0 0 1 21 8.5V18a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z" fill="#e8b43c"/></svg> Desktop / aorta_lesson</div>
    <p class="dlg-hint">Tick both files to compare them, then click OK.</p>
    <ul class="filelist">
      <li><label><input type="checkbox" name="f" value="healthy" checked><span class="fic">VTU</span> healthy.vtu <span class="fsize">35.8 MB</span></label></li>
      <li><label><input type="checkbox" name="f" value="diseased" checked><span class="fic">VTU</span> diseased.vtu <span class="fsize">88.9 MB</span></label></li>
    </ul>
    <div class="dlg-actions">
      <button value="cancel" class="secondary">Cancel</button>
      <button value="ok" id="open-ok" class="primary">OK</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
